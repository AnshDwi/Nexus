# Local stack (`docker compose up --build`, then open http://localhost:5173):
#   dashboard  -> React dashboard (Vite dev server, proxies /api to `api`)
#   api        -> FastAPI           (on Vercel: Python Function)
#   scheduler  -> leader-elected relay + recovery (on Vercel: Daemon)
#   worker     -> RabbitMQ job worker            (on Vercel: Daemon)
#   migrate    -> alembic upgrade head           (on Vercel: CI step)
#   postgres / rabbitmq / redis -> managed services in production
# Compose itself is never deployed to Vercel (see docs/vercel-deployment.md).
x-nexus-env: &nexus-env
  POSTGRES_HOST: postgres
  RABBITMQ_HOST: rabbitmq
  REDIS_URL: redis://redis:6379/0
  EVENT_BUS: rabbitmq

services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *nexus-env
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *nexus-env
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    build: .
    command: ["python", "-m", "nexus.daemon", "scheduler"]
    environment: *nexus-env
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  worker:
    build: .
    command: ["python", "-m", "nexus.daemon", "worker"]
    environment: *nexus-env
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      NEXUS_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      - api

  # Rate limiting and shared counters (optional; the API degrades to
  # in-process limits without it).
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Messaging: job dispatch, work queues and the dead-letter queue.
  # Management UI: http://localhost:15672 (nexus / nexus).
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexus
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  dashboard_node_modules:
