# Prometheus for compose.production.yml. Workers are discovered through Docker
# DNS, so `WORKER_REPLICAS` can change without editing this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nexus-api
    metrics_path: /api/v1/internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: nexus-daemons
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:8081"]
        labels: {component: scheduler}
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8081
    relabel_configs:
      - target_label: component
        replacement: worker
        source_labels: [__meta_dns_name]
        regex: worker
