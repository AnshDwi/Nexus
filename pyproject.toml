[project]
name = "nexus"
version = "0.1.0"
description = "Nexus - Production-Grade Internal Developer Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "aio-pika>=9.5",
    "prometheus-client>=0.21",
    "vercel-queue>=0.11,<0.12",
    "httpx>=0.27",
]

[tool.vercel]
# The FastAPI app Vercel serves as one Python Function (Fluid compute).
entrypoint = "vercel_app.api:app"

# Vercel Queues push-mode consumer. At build time Vercel imports the module,
# reads its @subscribe registrations and generates a private queue-triggered
# function. Remove this entry if you run the poll-mode worker daemon instead
# (a consumer group is either push or poll).
[[tool.vercel.subscribers]]
entrypoint = "vercel_app.queue_subscriber"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration and not e2e and not resilience'"
markers = [
    "integration: requires live infrastructure (Postgres/Redis/RabbitMQ) via docker compose; run explicitly with -m integration",
    "e2e: black-box tests against a running `docker compose` stack; run explicitly with -m e2e",
    "resilience: DESTRUCTIVE failure drills against compose.production.yml (restarts/kills containers); run explicitly with -m resilience",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vercel build artifacts (`vercel build` output and generated queue handlers).
extend-exclude = [".vercel", "_vc_queue_handlers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the idiomatic pattern

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]
